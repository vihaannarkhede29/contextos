name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish packages
        run: |
          publish_pkg() {
            set +e
            output=$(pnpm --filter "$1" publish --access public --no-git-checks 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -ne 0 ]; then
              if echo "$output" | grep -q "previously published"; then
                echo "Skipping $1 — version already on npm"
              else
                exit "$status"
              fi
            fi
          }
          publish_pkg @contextosai/shared
          publish_pkg @contextosai/core
          publish_pkg contextosai
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
